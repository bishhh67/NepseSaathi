{% extends "base.html" %}
{% load static %}

{% block title %}Live Market - NEPSE Sathi{% endblock %}

{% block extra_head %}
<style>
    .live-market-container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 100px 24px 40px;
    }
    
    .tables-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
        gap: 24px;
    }
    
    .table-card {
        background: white;
        border-radius: 24px;
        padding: 24px;
        border: 1px solid var(--border);
        box-shadow: var(--card-shadow);
        transition: all 0.3s ease;
    }

    .table-card:hover {
        transform: translateY(-4px);
        box-shadow: var(--card-shadow-hover);
        border-color: var(--primary);
    }
    
    .table-card h2 {
        color: var(--text-main);
        font-size: 1.1rem;
        font-weight: 800;
        margin-bottom: 20px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    
    .preview-table {
        width: 100%;
        border-collapse: collapse;
    }
    
    .preview-table th {
        text-align: left;
        padding: 12px 8px;
        color: var(--text-muted);
        font-size: 0.65rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        border-bottom: 1px solid var(--border);
    }
    
    .preview-table td {
        padding: 12px 8px;
        color: var(--text-main);
        font-size: 0.9rem;
        font-weight: 600;
        border-bottom: 1px solid #f8fafc;
    }

    .preview-table tr:last-child td { border: none; }
    
    .row-gain td:nth-child(3) { color: #10B981 !important; font-weight: 800; }
    .row-loss td:nth-child(3) { color: #EF4444 !important; font-weight: 800; }
    
    .chart-container {
        background: white;
        border-radius: 24px;
        margin-bottom: 32px;
        height: 600px;
        overflow: hidden;
        border: 1px solid var(--border);
        box-shadow: var(--card-shadow);
    }
    
    .chart-container iframe {
        width: 100%;
        height: 100%;
        border: none;
    }
    
    .loader-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(8px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 9999;
    }
    
    .spinner {
        width: 50px;
        height: 50px;
        border: 4px solid #f3f4f6;
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
        to { transform: rotate(360deg); }
    }
</style>
{% endblock %}

{% block content %}
<div id="loaderOverlay" class="loader-overlay">
    <div class="spinner"></div>
</div>

<div class="live-market-container pt-24">
    <!-- Chart Section -->
    <div class="chart-container">
        <iframe src="https://nepsealpha.com/trading/chart"></iframe>
    </div>

    <!-- Control Bar -->
    <div class="card-premium !py-4 flex justify-between items-center mb-8">
        <div class="flex items-center gap-3">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span class="text-sm font-bold text-gray-500 uppercase tracking-widest">Market Status:</span>
            <span id="lastUpdate" class="text-sm font-black text-gray-900">CONNECTING...</span>
        </div>
        <button class="bg-blue-600 text-white px-6 py-2 rounded-full font-bold text-sm hover:bg-blue-700 shadow-lg hover:shadow-blue-100 transition-all flex items-center gap-2" onclick="refreshData()">
            🔄 SYNC DATA
        </button>
    </div>

    <!-- Grid -->
    <div class="tables-grid" id="tablesGrid">
        <div class="col-span-full py-20 text-center text-gray-400 font-medium italic">
            Gathering live market insights...
        </div>
    </div>
</div>

<script>
    const CATEGORIES = [
        { key: 'gainers', name: '📈 TOP GAINERS', cols: ['symbol', 'close', 'diff_per'], headers: ['SYMBOL', 'LTP', 'CHANGE %'] },
        { key: 'losers', name: '📉 TOP LOSERS', cols: ['symbol', 'close', 'diff_per'], headers: ['SYMBOL', 'LTP', 'CHANGE %'] },
        { key: 'turnovers', name: '💰 TURNOVER LEADERS', cols: ['symbol', 'close', 'traded_amount'], headers: ['SYMBOL', 'LTP', 'AMOUNT'] },
        { key: 'traded', name: '📊 VOLUME LEADERS', cols: ['symbol', 'close', 'traded_quantity'], headers: ['SYMBOL', 'LTP', 'VOLUME'] },
        { key: 'transactions', name: '🔄 MOST ACTIVE', cols: ['symbol', 'close', 'no_trade'], headers: ['SYMBOL', 'LTP', 'TRADES'] },
        { key: 'brokers', name: '🏢 TOP BROKERS', cols: ['number', 'name', 'totalAmount'], headers: ['ID', 'BROKER NAME', 'TOTAL'] }
    ];

    async function loadData() {
        try {
            const response = await fetch('/api/market-data/?t=' + Date.now());
            const text = await response.text();
            const match = text.match(/window\.LATEST_MARKET_DATA = ({.*?});/s);
            if (match) {
                const data = JSON.parse(match[1]);
                window.LATEST_MARKET_DATA = data;
                renderDashboard();
                document.getElementById('lastUpdate').innerText = 'LIVE ✓';
            } else {
                throw new Error('Invalid data format');
            }
        } catch (error) {
            console.error('Error loading data:', error);
            document.getElementById('lastUpdate').innerText = 'OFFLINE';
            document.getElementById('tablesGrid').innerHTML = '<div class="col-span-full py-20 text-center text-rose-500 font-bold">Failed to load market data. Please click "SYNC DATA".</div>';
        }
    }

    function renderDashboard() {
        const grid = document.getElementById('tablesGrid');
        grid.innerHTML = '';
        const data = window.LATEST_MARKET_DATA;

        CATEGORIES.forEach(cat => {
            const catData = data[cat.key];
            const card = document.createElement('div');
            card.className = 'table-card';
            
            let html = `<h2>${cat.name}</h2>`;
            
            if (catData && catData.data && catData.data.length > 0) {
                html += `<table class="preview-table"><thead><tr>`;
                cat.headers.forEach(h => html += `<th>${h}</th>`);
                html += `</tr></thead><tbody>`;
                
                catData.data.slice(0, 8).forEach(row => {
                    let rowClass = (cat.key === 'gainers') ? 'row-gain' : (cat.key === 'losers' ? 'row-loss' : '');
                    html += `<tr class="${rowClass}">`;
                    cat.cols.forEach(col => {
                        let value = row[col] || '-';
                        if (col === 'diff_per' && value) value = value + '%';
                        if (col === 'traded_amount' && value) value = 'Rs. ' + Number(value).toLocaleString();
                        html += `<td>${value}</td>`;
                    });
                    html += `</tr>`;
                });
                html += `</tbody></table>`;
            } else {
                html += `<div style="padding: 60px; text-align: center; color: #94A3B8; font-style: italic;">No current data available</div>`;
            }
            
            card.innerHTML = html;
            grid.appendChild(card);
        });
    }

    async function refreshData() {
        const loader = document.getElementById('loaderOverlay');
        loader.style.display = 'flex';
        try {
            const response = await fetch('/api/scrape/');
            if (response.ok) {
                await loadData();
            } else {
                alert('Sync failed. Please try again.');
            }
        } catch (error) {
            alert('Error connecting to scraper.');
        } finally {
            loader.style.display = 'none';
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadData();
    });
</script>
{% endblock %}
