{% extends "base.html" %}
{% load static %}

{% block title %}Live Market - NEPSE Sathi{% endblock %}

{% block extra_head %}
<style>
    /* Critical styles - paste these directly */
    .live-market-container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 100px 24px 40px;
    }
    
    .control-bar {
        background: #1E293B;
        padding: 20px;
        border-radius: 12px;
        margin-bottom: 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    
    .btn-refresh {
        background: #C9A84C;
        color: #0F172A;
        border: none;
        padding: 10px 25px;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
    }
    
    .btn-refresh:hover {
        background: #B8960C;
    }
    
    .tables-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
        gap: 24px;
    }
    
    .table-card {
        background: #1E293B;
        border-radius: 16px;
        padding: 20px;
        border: 1px solid #334155;
    }
    
    .table-card h2 {
        color: #C9A84C;
        font-size: 1.2rem;
        margin-bottom: 16px;
    }
    
    .preview-table {
        width: 100%;
        border-collapse: collapse;
    }
    
    .preview-table th {
        text-align: left;
        padding: 10px;
        color: #94A3B8;
        font-size: 0.7rem;
        text-transform: uppercase;
    }
    
    .preview-table td {
        padding: 10px;
        color: #F8FAFC;
        border-top: 1px solid #334155;
    }
    
    .row-gain td {
        color: #10B981;
    }
    
    .row-loss td {
        color: #EF4444;
    }
    
    .chart-container {
        background: #0F172A;
        border-radius: 16px;
        margin-bottom: 30px;
        height: 500px;
        overflow: hidden;
    }
    
    .chart-container iframe {
        width: 100%;
        height: 100%;
        border: none;
    }
    
    .status-info {
        color: #10B981;
        font-weight: 600;
    }
    
    .loader-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #0F172A;
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 9999;
    }
    
    .spinner {
        width: 50px;
        height: 50px;
        border: 3px solid #334155;
        border-top-color: #C9A84C;
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
        to { transform: rotate(360deg); }
    }
</style>
{% endblock %}

{% block content %}

<div id="loaderOverlay" class="loader-overlay">
    <div class="spinner"></div>
</div>

<div class="live-market-container">
    
    <div class="chart-container">
        <iframe src="https://nepsealpha.com/trading/chart"></iframe>
    </div>

    <div class="control-bar">
        <div class="status-info">
            📊 DATA_STATUS: <span id="lastUpdate">CONNECTING...</span>
        </div>
        <button class="btn-refresh" onclick="refreshData()">
            🔄 MANUAL REFRESH
        </button>
    </div>

    <div class="tables-grid" id="tablesGrid">
        <div style="text-align: center; grid-column: span 2;">Loading market data...</div>
    </div>
    
</div>

<script>
    const CATEGORIES = [
        { key: 'gainers', name: '📈 TOP GAINERS', cols: ['symbol', 'close', 'diff_per'], headers: ['SYMBOL', 'LTP', 'CHANGE %'] },
        { key: 'losers', name: '📉 TOP LOSERS', cols: ['symbol', 'close', 'diff_per'], headers: ['SYMBOL', 'LTP', 'CHANGE %'] },
        { key: 'turnovers', name: '💰 TURNOVER LEADERS', cols: ['symbol', 'close', 'traded_amount'], headers: ['SYMBOL', 'LTP', 'AMOUNT'] },
        { key: 'traded', name: '📊 VOLUME LEADERS', cols: ['symbol', 'close', 'traded_quantity'], headers: ['SYMBOL', 'LTP', 'VOLUME'] },
        { key: 'transactions', name: '🔄 MOST ACTIVE', cols: ['symbol', 'close', 'no_trade'], headers: ['SYMBOL', 'LTP', 'TRADES'] },
        { key: 'brokers', name: '🏢 TOP BROKERS', cols: ['number', 'name', 'totalAmount'], headers: ['ID', 'BROKER NAME', 'TOTAL'] }
    ];

    async function loadData() {
        try {
            const response = await fetch('/api/market-data/?t=' + Date.now());
            const text = await response.text();
            
            // Extract the JSON from the JavaScript file
            const match = text.match(/window\.LATEST_MARKET_DATA = ({.*?});/s);
            if (match) {
                const data = JSON.parse(match[1]);
                window.LATEST_MARKET_DATA = data;
                renderDashboard();
                document.getElementById('lastUpdate').innerText = 'LIVE ✓';
            } else {
                throw new Error('Invalid data format');
            }
        } catch (error) {
            console.error('Error loading data:', error);
            document.getElementById('lastUpdate').innerText = 'OFFLINE';
            document.getElementById('tablesGrid').innerHTML = '<div style="text-align: center; grid-column: span 2; color: red;">Failed to load market data. Please click "MANUAL REFRESH".</div>';
        }
    }

    function renderDashboard() {
        const grid = document.getElementById('tablesGrid');
        grid.innerHTML = '';
        const data = window.LATEST_MARKET_DATA;

        CATEGORIES.forEach(cat => {
            const catData = data[cat.key];
            const card = document.createElement('div');
            card.className = 'table-card';
            
            let html = `<h2>${cat.name}</h2>`;
            
            if (catData && catData.data && catData.data.length > 0) {
                html += `<table class="preview-table"><thead><tr>`;
                cat.headers.forEach(h => html += `<th>${h}</th>`);
                html += `</tr></thead><tbody>`;
                
                catData.data.slice(0, 8).forEach(row => {
                    let rowClass = (cat.key === 'gainers') ? 'row-gain' : (cat.key === 'losers' ? 'row-loss' : '');
                    html += `<tr class="${rowClass}">`;
                    cat.cols.forEach(col => {
                        let value = row[col] || '-';
                        if (col === 'diff_per' && value) value = value + '%';
                        if (col === 'traded_amount' && value) value = 'Rs. ' + Number(value).toLocaleString();
                        html += `<td>${value}</td>`;
                    });
                    html += `</tr>`;
                });
                html += `</tbody></table>`;
            } else {
                html += `<div style="padding: 40px; text-align: center; color: #64748B;">No data available</div>`;
            }
            
            card.innerHTML = html;
            grid.appendChild(card);
        });
    }

    async function refreshData() {
        const loader = document.getElementById('loaderOverlay');
        loader.style.display = 'flex';
        
        try {
            const response = await fetch('/api/scrape/');
            const result = await response.json();
            
            if (response.ok) {
                await loadData();
            } else {
                alert('Error: ' + (result.message || 'Failed to sync data'));
            }
        } catch (error) {
            alert('Error: Make sure your scraper is working');
        } finally {
            loader.style.display = 'none';
        }
    }

    // Auto-load on page load
    document.addEventListener('DOMContentLoaded', () => {
        loadData();
    });
</script>

{% endblock %}
