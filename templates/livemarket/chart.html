<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Page Chart</title>
    <style>
        /* Reset default margins and padding for full-screen coverage */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Make the wrapper take the full viewport height */
        #iframe-wrapper {
            width: 100%;
            height: 100vh;         /* 100% of the viewport height */
            position: relative;    /* Establishes a positioning context for the iframe */
        }

        /* Style the iframe to fill the wrapper completely */
        #iframe-chart {
            width: 100%;
            height: 100%;
            display: block;
            border: none;          /* Remove default iframe border */
        }

        /* Optional: Hide the loader if it's not needed */
        #iframe-loader {
            display: none;
        }
    </style>
</head>
<body>
    <div id="iframe-wrapper" bis_skin_checked="1">
        <div id="iframe-loader" class="loader eff-blink" bis_skin_checked="1" style="display: none;">
            Loading...
        </div>
        <iframe src="https://nepsealpha.com/trading/chart" id="iframe-chart" title="Trading Chart" frameborder="0" style="display: block;"></iframe>
    </div>
</body>
</html>
