<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}NEPSE Sathi — Nepal's Intelligent Stock Platform{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}Learn, analyze, and make smarter stock market decisions with NEPSE Sathi — Nepal's most intelligent stock education platform.{% endblock %}" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- HTMX -->
  <script src="https://unpkg.com/htmx.org@1.9.10" defer></script>

  {% load static %}
  <link rel="stylesheet" href="{% static 'css/main.css' %}" />

  {% block extra_head %}{% endblock %}

  <style>
    :root {
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --secondary: #10b981;
        --accent: #6366f1;
        --background: #f8fafc;
        --surface: #ffffff;
        --text-main: #0f172a;
        --text-muted: #64748b;
        --border: #e2e8f0;
        --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        --card-shadow-hover: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }

    html, body {
      background-color: var(--background) !important;
      color: var(--text-main) !important;
      font-family: 'Inter', sans-serif !important;
      min-height: 100vh;
    }

    /* Force Navbar to be Light */
    #navbar-bg {
        background-color: rgba(255, 255, 255, 0.9) !important;
        backdrop-filter: blur(12px) !important;
        border-bottom: 1px solid var(--border) !important;
        opacity: 1 !important;
    }

    #navbar span, #navbar a {
        color: var(--text-main) !important;
    }
    
    #navbar a:hover {
        color: var(--primary) !important;
    }

    #navbar .bg-blue-50 {
        background-color: #eff6ff !important;
        color: var(--primary) !important;
    }

    .app-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        background: 
            radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.05) 0px, transparent 50%),
            radial-gradient(at 100% 0%, rgba(16, 185, 129, 0.05) 0px, transparent 50%),
            radial-gradient(at 50% 100%, rgba(99, 102, 241, 0.05) 0px, transparent 50%);
    }

    /* Override any dark elements from main.css */
    main { background-color: transparent !important; }
    
    .card-premium {
        background: var(--surface) !important;
        border: 1px solid var(--border) !important;
        border-radius: 24px !important;
        padding: 2rem !important;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1) !important;
        box-shadow: var(--card-shadow) !important;
        color: var(--text-main) !important;
    }
    
    .card-premium:hover {
        transform: translateY(-8px) !important;
        box-shadow: var(--card-shadow-hover) !important;
        border-color: var(--primary) !important;
    }

    h1, h2, h3, h4, h5, h6 { color: var(--text-main) !important; }

    /* Kill decorative blobs from old templates */
    body > div.fixed, body > div.pointer-events-none { display: none !important; }
  </style>
</head>
<body class="antialiased">
  <div class="app-bg"></div>

  {% include "components/navbar.html" %}

  <main class="relative z-10 min-h-screen">
    {% block content %}{% endblock %}
  </main>

  {% include "components/footer.html" %}

  <script src="{% static 'js/main.js' %}"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
