<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}NEPSE Sathi — Nepal's Intelligent Stock Platform{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}Learn, analyze, and make smarter stock market decisions with NEPSE Sathi — Nepal's most intelligent stock education platform.{% endblock %}" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- HTMX -->
  <script src="https://unpkg.com/htmx.org@1.9.10" defer></script>

  <!-- Custom CSS: main first, then page-level -->
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/main.css' %}" />

  {% block extra_head %}{% endblock %}

  <!-- Force white theme — overrides any dark styles from main.css or Tailwind -->
  <style>
    html, body {
      background-color: #F8FAFC !important;
      color: #0F172A !important;
    }
    /* Kill dark decorative blobs injected by some base templates */
    body > div.fixed,
    body > div.pointer-events-none {
      display: none !important;
    }
  </style>
</head>
<body style="background-color: #F8FAFC !important; color: #0F172A !important;">

  {% include "components/navbar.html" %}

  <main style="background-color: #F8FAFC !important;">
    {% block content %}{% endblock %}
  </main>

  {% include "components/footer.html" %}

  <script src="{% static 'js/main.js' %}"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
