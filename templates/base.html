<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}NEPSE Sathi — Nepal's Intelligent Stock Platform{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}Learn, analyze, and make smarter stock market decisions with NEPSE Sathi — Nepal's most intelligent stock education platform.{% endblock %}" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary:   '#1A1F36',
            secondary: '#5A677A',
            accent:    '#2563EB',
            success:   '#10B981',
            danger:    '#EF4444',
            warning:   '#F59E0B',
            gray: {
              50:  '#F9FAFB',
              100: '#F3F4F6',
              200: '#E5E7EB',
              300: '#D1D5DB',
              400: '#9CA3AF',
              500: '#6B7280',
              600: '#4B5563',
              700: '#374151',
              800: '#1F2937',
              900: '#111827',
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'sans-serif'],
            mono: ['SF Mono', 'Monaco', 'Inconsolata', 'Fira Code', 'monospace'],
          },
          animation: {
            'fade-up': 'fadeUp 0.5s ease forwards',
          },
          keyframes: {
            fadeUp: {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
          },
        }
      }
    }
  </script>

  <!-- Custom CSS -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background-color: #F8F9FA;
      color: #1A1F36;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      line-height: 1.5;
    }
    
    /* Card styles */
    .card {
      background: #FFFFFF;
      border: 1px solid #E5E7EB;
      border-radius: 12px;
      transition: all 0.2s ease;
    }
    
    .card:hover {
      border-color: #D1D5DB;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    
    /* Badge styles */
    .badge-gain {
      background: #DEF7EC;
      color: #03543F;
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 500;
    }
    
    .badge-loss {
      background: #FDE2E2;
      color: #9B1C1C;
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 500;
    }
    
    .badge-neutral {
      background: #F3F4F6;
      color: #4B5563;
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 500;
    }
    
    /* Button styles */
    .btn-primary {
      background: #2563EB;
      color: white;
      padding: 0.6rem 1.25rem;
      border-radius: 8px;
      font-weight: 500;
      font-size: 0.875rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: background 0.2s;
      border: none;
      cursor: pointer;
    }
    
    .btn-primary:hover {
      background: #1D4ED8;
    }
    
    .btn-ghost {
      background: transparent;
      color: #4B5563;
      padding: 0.6rem 1.25rem;
      border-radius: 8px;
      font-weight: 500;
      font-size: 0.875rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      border: 1px solid #E5E7EB;
      transition: all 0.2s;
      cursor: pointer;
    }
    
    .btn-ghost:hover {
      background: #F9FAFB;
      border-color: #D1D5DB;
      color: #1F2937;
    }
    
    /* Gradient text */
    .gradient-text {
      color: #2563EB;
    }
    
    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    
    ::-webkit-scrollbar-track {
      background: #F1F3F5;
    }
    
    ::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 3px;
    }
    
    ::-webkit-scrollbar-thumb:hover {
      background: #94A3B8;
    }
    
    /* Reveal animation */
    .reveal {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    
    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }
    
    /* Section label */
    .section-label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #6B7280;
    }
  </style>

  {% block extra_head %}{% endblock %}
</head>
<body class="bg-gray-50 text-gray-900 antialiased">

  {% include "components/navbar.html" %}

  <main>
    {% block content %}{% endblock %}
  </main>

  {% include "components/footer.html" %}

  <script>
    // Reveal animation on scroll
    document.addEventListener('DOMContentLoaded', function() {
      const reveals = document.querySelectorAll('.reveal');
      
      function checkReveal() {
        reveals.forEach(element => {
          const windowHeight = window.innerHeight;
          const elementTop = element.getBoundingClientRect().top;
          const revealPoint = 100;
          
          if (elementTop < windowHeight - revealPoint) {
            element.classList.add('visible');
          }
        });
      }
      
      window.addEventListener('scroll', checkReveal);
      checkReveal();
    });
  </script>
  
  {% block extra_scripts %}{% endblock %}
</body>
</html>
